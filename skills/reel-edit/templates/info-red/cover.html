<!-- style-08 cover (last 0.5 s of the reel + cover PNG). Placeholders are filled by info_red.Reel.cover(). -->
<div class="cv">
  <div class="cv-grid"></div><div class="cv-glow"></div>
  <div class="cv-top"><span class="cv-part">PART {PART2}</span><span class="cv-of">of {PARTS}</span><span class="cv-dot"></span><span class="cv-ser">{KICKER}</span></div>
  <div class="cv-rag">{SERIES}</div>
  <div class="cv-sub"><span class="a">{LINE_A}</span><span class="b">{LINE_B}</span></div>
  <div class="cv-pol"><img src="{FACE}"><span>{POLAROID}</span></div>
  {STICKERS}
  <div class="cv-note">{NOTE}</div>
  <div class="cv-steps">{STEPS}</div>
</div>
